name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -race

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foodorder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run migrations
        run: go run ./cmd/api &
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: foodorder
          DB_SSLMODE: disable
          JWT_SECRET: ci-test-secret
      - name: Wait for migrations
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/health && break || sleep 1
          done
          kill %1 2>/dev/null || true
      - name: Run integration tests
        run: go test -tags=integration ./tests/integration/... -race -v
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: foodorder
          DB_SSLMODE: disable
          JWT_SECRET: ci-test-secret

  smoke:
    name: E2E smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: cp .env.example .env
      - name: Start services
        run: docker compose up --build -d
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break || sleep 1
          done
      - name: Seed data
        run: docker compose exec -T api /seed
      - name: Run smoke tests
        run: ./scripts/smoke.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
